<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mentro - Register</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;900&family=Space+Grotesk:wght@500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-base: #0a0a0a;
            --bg-surface: #141414;
            --bg-surface-2: #1c1c1c;
            --accent-1: #FF5A1F;
            --accent-2: #FF7A47;
            --accent-gradient: linear-gradient(135deg, #FF5A1F 0%, #FF7A47 100%);
            --text-hi: #ffffff;
            --text-mid: rgba(255, 255, 255, 0.6);
            --text-low: rgba(255, 255, 255, 0.38);
            --border-soft: rgba(255, 255, 255, 0.08);
            --border-strong: rgba(255, 255, 255, 0.18);
            --accent-border-soft: rgba(255, 90, 31, 0.16);
            --accent-border-strong: rgba(255, 90, 31, 0.4);
        }
        * { margin:0; padding:0; box-sizing:border-box; font-family:'Inter',sans-serif; min-width:0; }
    html { overflow-x: hidden; -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
    img, svg, video { max-width: 100%; height: auto; }
        body {
            min-height: 100dvh;
            overflow-x: hidden;
            max-width: 100vw;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            background: var(--bg-base);
        }
        .card {
            position: relative;
            z-index: 1;
            background: var(--bg-surface);
            border: 1px solid var(--border-soft);
            border-radius: 24px;
            padding: clamp(28px, 6vw, 42px) clamp(20px, 5vw, 38px);
            width: 100%;
            max-width: 420px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.45), 0 0 0 1px rgba(255, 255, 255, 0.02) inset;
            animation: cardEnter 0.5s cubic-bezier(0.16, 1, 0.3, 1);
        }
        @keyframes cardEnter { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: translateY(0); } }

        .logo-icon-wrap { display: flex; justify-content: center; margin-bottom: 14px; }
        .logo-icon {
            width: 52px; height: 52px;
            background: var(--accent-gradient);
            border-radius: 14px;
            display: flex; align-items: center; justify-content: center;
            font-family: 'Space Grotesk', sans-serif;
            font-size: 1.6rem; font-weight: 700; color: white;
            box-shadow: 0 8px 30px rgba(255, 90, 31, 0.35);
        }
        .logo { text-align: center; margin-bottom: 8px; }
        .logo h1 { font-family: 'Space Grotesk', sans-serif; color: var(--text-hi); font-size: clamp(1.35rem, 4vw + 0.6rem, 1.7rem); font-weight: 700; letter-spacing: -0.5px; }
        .logo h1 span {
            background: var(--accent-gradient);
            -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent;
        }
        .logo p { color: var(--text-low); font-size: 0.72rem; letter-spacing: 2px; text-transform: uppercase; margin-top: 5px; font-family: 'JetBrains Mono', monospace; }

        .divider { height: 1px; background: var(--border-soft); margin: 26px 0; }
        .form-group { margin-bottom: 16px; }
        label { color: var(--text-mid); font-size: 0.76rem; display: block; margin-bottom: 8px; letter-spacing: 1px; text-transform: uppercase; font-weight: 600; }
        input {
            width: 100%; padding: 13px 16px;
            background: var(--bg-surface-2);
            border: 1px solid var(--border-soft);
            border-radius: 12px;
            color: var(--text-hi);
            font-size: 0.95rem;
            outline: none;
            transition: all 0.2s;
            font-family: 'Inter', sans-serif;
        }
        input:focus { border-color: var(--accent-1); box-shadow: 0 0 0 3px rgba(255, 90, 31, 0.15); }
        input::placeholder { color: var(--text-low); }
        .hint { color: var(--text-low); font-size: 0.74rem; margin-top: 5px; }

        button {
            width: 100%; padding: 15px;
            background: var(--accent-gradient);
            color: white; border: none; border-radius: 14px;
            font-size: 0.95rem; font-weight: 700;
            font-family: 'Space Grotesk', sans-serif;
            letter-spacing: 0.4px;
            cursor: pointer;
            margin-top: 8px;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
            box-shadow: 0 8px 26px rgba(255, 90, 31, 0.3);
        }
        button:hover { transform: scale(1.02); box-shadow: 0 10px 34px rgba(255, 90, 31, 0.42); }
        button:active { transform: scale(0.98); }

        .error { color: #ff6b6b; font-size: 0.85rem; margin-top: 14px; text-align: center; display: none; }
        .success { color: #4ade80; font-size: 0.85rem; margin-top: 14px; text-align: center; display: none; }
        .links { margin-top: 22px; text-align: center; }
        .links a { color: var(--text-low); font-size: 0.85rem; text-decoration: none; transition: color 0.2s; }
        .links a:hover { color: var(--accent-1); }
        .links a span { color: var(--accent-1); font-weight: 600; }

        button:focus-visible, input:focus-visible, a:focus-visible {
            outline: 2px solid var(--accent-1); outline-offset: 2px;
        }
        @media (prefers-reduced-motion: reduce) {
            *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="logo-icon-wrap"><div class="logo-icon">M</div></div>
        <div class="logo">
            <h1>Mentro</h1>
            <p>Create Your Account</p>
        </div>
        <div class="divider"></div>
        <div class="form-group">
            <label>Username</label>
            <input type="text" id="username" placeholder="yourname"/>
        </div>
        <div class="form-group">
            <label>Email</label>
            <input type="email" id="email" placeholder="your@email.com"/>
        </div>
        <div class="form-group">
            <label>Password</label>
            <input type="password" id="password" placeholder="••••••••"/>
            <p class="hint">Minimum 6 characters</p>
        </div>
        <div class="form-group">
            <label>Confirm Password</label>
            <input type="password" id="confirm-password" placeholder="••••••••" onkeypress="handleKey(event)"/>
        </div>
        <button onclick="register()">Create Account 💪</button>
        <p class="error" id="error-msg"></p>
        <p class="success" id="success-msg"></p>
        <div class="links">
            <a href="/login">Already have an account? <span>Login</span></a>
        </div>
    </div>
    <script>
        async function register() {
            const username = document.getElementById('username').value.trim();
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const confirmPassword = document.getElementById('confirm-password').value.trim();
            const errorMsg = document.getElementById('error-msg');
            const successMsg = document.getElementById('success-msg');
            errorMsg.style.display = 'none';
            successMsg.style.display = 'none';
            if (!username || !email || !password || !confirmPassword) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Please fill in all fields!';
                return;
            }
            if (password !== confirmPassword) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Passwords do not match!';
                return;
            }
            if (password.length < 6) {
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'Password must be at least 6 characters!';
                return;
            }
            const response = await fetch('/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ username, email, password })
            });
            const data = await response.json();
            if (data.success) {
                successMsg.style.display = 'block';
                successMsg.textContent = 'Account created! Redirecting to login...';
                setTimeout(() => window.location.href = '/login', 2000);
            } else {
                errorMsg.style.display = 'block';
                errorMsg.textContent = data.error;
            }
        }
        function handleKey(event) { if (event.key === 'Enter') register(); }
    </script>
</body>
</html>
